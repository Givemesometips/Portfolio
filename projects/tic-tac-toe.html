<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e13"><title>Tic Tac Toe — Mark Patlingrao</title><link rel="stylesheet" href="../assets/css/games.css"></head><body>
<div class="game-shell"><nav class="game-nav" aria-label="Project navigation"><a class="game-logo" href="../index.html">M<span>.</span>P / PROJECTS</a><a class="home-link" href="../index.html#projects">← Back to portfolio</a></nav><main class="game-wrap"><span class="eyebrow">03 / STRATEGY GAME</span><h1>Tic Tac Toe<span class="highlight">.</span></h1><p class="subtitle">A two-player classic. Take turns with a friend and connect three in a row to win.</p><div class="game-panel"><div class="scoreboard"><div class="score"><span>PLAYER X</span><strong id="score-x">0</strong></div><div class="score"><span>DRAWS</span><strong id="score-d">0</strong></div><div class="score"><span>PLAYER O</span><strong id="score-o">0</strong></div></div><p class="status" id="status" role="status" aria-live="polite">Player X's turn</p><div class="tic-board" id="board" aria-label="Tic Tac Toe board"></div><div class="row"><button id="again" type="button" class="game-action">New round ↻</button><button id="reset" type="button" class="game-action game-action-secondary">Reset scores</button></div><p class="smallprint">Two players · One screen</p></div></main><footer class="footer"><span>STRATEGY GAME / JAVASCRIPT</span><span>© Mark Patlingrao</span></footer></div>
<script>
(()=>{'use strict';
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),patterns=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),turn='X',over=false,scores={X:0,O:0,D:0};function updateScore(){for(const [key,id] of [['X','score-x'],['O','score-o'],['D','score-d']])document.getElementById(id).textContent=scores[key];}
function move(i){if(over||board[i])return;board[i]=turn;render();const won=patterns.find(([a,b,c])=>board[a]&&board[a]===board[b]&&board[a]===board[c]);if(won){over=true;scores[turn]++;updateScore();statusEl.textContent=`Player ${turn} wins! 🎉`;won.forEach(j=>boardEl.children[j].classList.add('winning'));render();return;}if(board.every(Boolean)){over=true;scores.D++;updateScore();statusEl.textContent="It's a draw!";render();return;}turn=turn==='X'?'O':'X';statusEl.textContent=`Player ${turn}'s turn`;}
function render(){[...boardEl.children].forEach((el,i)=>{el.textContent=board[i];el.setAttribute('aria-label',`Row ${Math.floor(i/3)+1}, column ${i%3+1}: ${board[i]||'empty'}`);el.classList.toggle('player-o',board[i]==='O');el.disabled=!!board[i]||over;});}
function newRound(){board=Array(9).fill('');turn='X';over=false;boardEl.replaceChildren();for(let i=0;i<9;i++){const b=document.createElement('button');b.type='button';b.className='tic-cell';b.addEventListener('click',()=>move(i));boardEl.appendChild(b);}statusEl.textContent="Player X's turn";render();}
document.getElementById('again').addEventListener('click',newRound);document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0,D:0};updateScore();newRound();});updateScore();newRound();
})();
</script></body></html>
