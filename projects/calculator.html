<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e13"><title>Simple Calculator — Mark Patlingrao</title><link rel="stylesheet" href="../assets/css/games.css"></head><body>
<div class="game-shell"><nav class="game-nav" aria-label="Project navigation"><a class="game-logo" href="../index.html">M<span>.</span>P / PROJECTS</a><a class="home-link" href="../index.html#projects">← Back to portfolio</a></nav><main class="game-wrap"><span class="eyebrow">02 / WEB UTILITY</span><h1>Simple Calculator<span class="highlight">.</span></h1><p class="subtitle">A minimal calculator for everyday arithmetic. Use the buttons or your keyboard to calculate.</p><div class="calculator"><div class="game-panel calc-panel"><input id="screen" class="calc-screen" type="text" aria-label="Calculator display" value="0" readonly><div class="buttons" id="keys"><button type="button" class="calc-button clear" data-key="C">AC</button><button type="button" class="calc-button" data-key="back">⌫</button><button type="button" class="calc-button" data-key="%">%</button><button type="button" class="calc-button operator" data-key="/">÷</button><button type="button" class="calc-button" data-key="7">7</button><button type="button" class="calc-button" data-key="8">8</button><button type="button" class="calc-button" data-key="9">9</button><button type="button" class="calc-button operator" data-key="*">×</button><button type="button" class="calc-button" data-key="4">4</button><button type="button" class="calc-button" data-key="5">5</button><button type="button" class="calc-button" data-key="6">6</button><button type="button" class="calc-button operator" data-key="-">−</button><button type="button" class="calc-button" data-key="1">1</button><button type="button" class="calc-button" data-key="2">2</button><button type="button" class="calc-button" data-key="3">3</button><button type="button" class="calc-button operator" data-key="+">+</button><button type="button" class="calc-button" data-key="0">0</button><button type="button" class="calc-button" data-key=".">.</button><button type="button" class="calc-button equal" style="grid-column:span 2" data-key="=">=</button></div></div><p class="calc-helper">Enter to calculate · Backspace to delete · Esc to clear</p></div></main><footer class="footer"><span>WEB UTILITY / JAVASCRIPT</span><span>© Mark Patlingrao</span></footer></div>
<script>
(()=>{'use strict';
const screen=document.getElementById('screen');let expr='',fresh=false;
function render(){screen.value=expr||'0';screen.scrollLeft=screen.scrollWidth;}
function evaluate(input){const ts=input.match(/(?:\d+(?:\.\d*)?|\.\d+)|[+*/()-]/g);if(!ts||ts.join('')!==input)throw Error('Invalid expression');let i=0;function atom(){if(ts[i]==='+'||ts[i]==='-'){const sign=ts[i++];return (sign==='-'?-1:1)*atom();}const tok=ts[i++];if(tok==='('){const val=sum();if(ts[i++]!==')')throw Error('Missing bracket');return val;}if(!tok||!/^\d*\.?\d+$/.test(tok))throw Error('Invalid value');return Number(tok);}function product(){let val=atom();while(ts[i]==='*'||ts[i]==='/'){const op=ts[i++],next=atom();val=op==='*'?val*next:val/next;}return val;}function sum(){let val=product();while(ts[i]==='+'||ts[i]==='-'){const op=ts[i++],next=product();val=op==='+'?val+next:val-next;}return val;}const val=sum();if(i!==ts.length||!Number.isFinite(val))throw Error('Invalid result');return String(Number(val.toPrecision(12)));}
function press(key){if(key==='C'){expr='';fresh=false;render();return;}if(key==='back'){expr=expr.slice(0,-1);fresh=false;render();return;}if(key==='='){if(!expr)return;try{expr=evaluate(expr);fresh=true;}catch{expr='Error';fresh=true;}render();return;}if(expr==='Error')expr='';if(key==='%'){if(!expr)return;try{expr=String(Number((evaluate(expr)/100).toPrecision(12)));fresh=true;}catch{expr='Error';fresh=true;}render();return;}if(/[0-9]/.test(key)&&key.length===1){if(fresh){expr='';fresh=false;}expr+=key;}else if(key==='.'){if(fresh){expr='';fresh=false;}const current=expr.split(/[+*/-]/).pop();if(!current.includes('.'))expr+=(current?'':'0')+'.';}else if(['+','-','*','/'].includes(key)){fresh=false;if(!expr){if(key==='-')expr='-';else return;}else if(/[+*/-]$/.test(expr)&&!(expr==='-'&&key==='-'))expr=expr.slice(0,-1)+key;else expr+=key;}render();}
document.getElementById('keys').addEventListener('click',e=>{const btn=e.target.closest('button[data-key]');if(btn)press(btn.dataset.key);});document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let key=e.key;if(key==='Enter')key='=';else if(key==='Backspace')key='back';else if(key==='Escape')key='C';else if(key==='x'||key==='X')key='*';if(/^[\d.+*/%-]$/.test(key)||['=','C','back'].includes(key)){e.preventDefault();press(key);}});render();
})();
</script></body></html>
